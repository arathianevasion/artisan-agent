name: Script tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  script-tests:
    name: Script tests (Linux)
    # GitHub-hosted (free for this public repo: 4 vCPU, 16 GB). The job runs in a
    # throwaway container. Never point a public repo's jobs at a self-hosted runner:
    # a pull request from a fork could run code on that machine.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ubuntu:24.04
      # An init process reaps killed children, so the process-stop tests see them gone.
      options: --init
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git jq python3 perl procps tmux coreutils ca-certificates sudo >/dev/null
          useradd -m tester
      - uses: actions/checkout@v4
      - name: Show bash
        run: bash --version | head -n 1
      - name: Run the script test harness (as a non-root user)
        run: |
          chown -R tester "$GITHUB_WORKSPACE"
          sudo -u tester -H bash -c 'git config --global user.name CI && git config --global user.email ci@example.invalid && git config --global init.defaultBranch main && git config --global --add safe.directory "*" && plugins/artisan-agent/tests/run.sh'

  script-tests-macos:
    name: Script tests (macOS, Apple bash 3.2)
    # Apple's own /bin/bash 3.2: the only build that reproduces the EXIT-trap masking
    # #126 guards against (a bash 3.2 built from source on Linux doesn't).
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show bash
        run: /bin/bash --version | head -n 1
      - name: Run the script test harness under /bin/bash
        run: |
          command -v jq >/dev/null || brew install jq
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          /bin/bash plugins/artisan-agent/tests/run.sh
