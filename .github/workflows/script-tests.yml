name: Script tests

# CI runs on pull requests and on demand only, never on a plain push. A session on
# the Mac gates locally until it opens a PR; a session on the VM dispatches this
# workflow against a throwaway branch to gate a merge.
#
# Linux and macOS are each three jobs: a matrix over shard 1, 2 and 3 of 3, each running
# tests/run.sh --shard <i>/3 on its own runner, so together they run every test exactly
# once and neither OS sets the wait alone (#380: the single Linux job did). fail-fast is off so every
# failing shard reports. A run's overall conclusion is red if any shard is red, and that
# is all scripts/merge-gate.sh reads.
#
# Every test job passes --rerun-failed: a failed test runs once more on its own, and
# one that then passes is reported FLAKY and doesn't turn the run red. Tests listed in
# tests/quarantine.txt run but can't fail it; the quarantine job checks, once per run,
# that each entry's issue is still open. Flaky and quarantined tests go to the run's
# step summary.
#
# A dispatch's macos input (default true) set to false leaves the macOS job out, so
# the run is Linux only: its overall conclusion is the Linux job's and the quarantine
# check's. It is for a worker's branch run (ci_gate.worker_inputs in
# .artisan-agent/config.yml): a GitHub Free account runs at most 5 macOS jobs at once
# across all its repos, and each run takes 3. A pull request has no inputs and a dispatch that doesn't pass it gets the
# default, so both run macOS; the merge gate never passes it, so every merge is still
# gated on Linux and Apple bash 3.2.
#
# A dispatch's run name carries the macos input (#212), because GitHub doesn't show a
# run's inputs: the merge gate reuses a worker's green branch run only when its name
# shows the default, macos=true, the way the gate's own dispatch runs. A pull request
# keeps its title as the run name.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Script tests (macos={0})', inputs.macos) || github.event.pull_request.title }}

on:
  pull_request:
    # Documentation outside the plugin isn't read by any test.
    paths-ignore: ['*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      runner:
        description: Linux runner (auto = the watsonsoft pool when it's online and takes the job within 10 minutes, else github; home-wsl = the pool, waiting for it; macOS always runs on macos-latest)
        type: choice
        options: [auto, home-wsl, github, ubicloud]
        default: auto
      macos:
        description: Run the macOS job (false leaves it out; a worker's branch run)
        type: boolean
        default: true

# A newer run for the same PR or branch cancels its older run.
concurrency:
  group: script-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Picks the Linux runner through watsonsoft/ci-shared's runner picker: the org's home-wsl pool
  # (the owner's PC) first, else GitHub-hosted ubuntu-latest (free for this public repo). A pull
  # request from a fork never gets the pool: this repo is public, and a fork's PR must not run code
  # on a self-hosted machine. runner=home-wsl forces the pool and runner=github the fallback;
  # runner=ubicloud is applied in pick-final.
  pick:
    uses: watsonsoft/ci-shared/.github/workflows/runner-picker.yml@v1
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
    with:
      force: ${{ inputs.runner == 'home-wsl' && 'pool' || ((inputs.runner == 'github' || inputs.runner == 'ubicloud') && 'fallback' || '') }}

  # The PC can drop off after the pick, and a job queued for a runner that isn't there
  # waits for hours (#399). So when the PC was picked, a probe job queues for it first
  # and pick-final watches the probe: if the probe hasn't started within the wait
  # (10 minutes), the Linux tests go to ubuntu-latest instead. The probe does nothing
  # but start. Same trust rule as above: the PC is only ever picked for a run that
  # the picker trusted, so a fork PR never gets a probe or the tests on the PC.
  pc-probe:
    name: Probe the PC runner
    needs: pick
    if: needs.pick.outputs.pool == 'true' && inputs.runner != 'home-wsl'
    runs-on: ${{ fromJSON(needs.pick.outputs.runner) }}
    timeout-minutes: 2
    steps:
      - run: echo "the PC runner picked this up"

  pick-final:
    name: Confirm the Linux runner
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      actions: read
    outputs:
      runner: ${{ steps.final.outputs.runner }}
    steps:
      - id: final
        env:
          GH_TOKEN: ${{ github.token }}
          PICKED: ${{ needs.pick.outputs.runner }}
          FALLBACK: ${{ needs.pick.outputs.fallback }}
          # Only an auto pick of the pool is probed and may fall back; an explicit home-wsl keeps waiting.
          PC: ${{ needs.pick.outputs.pool == 'true' && inputs.runner != 'home-wsl' }}
          UBICLOUD: ${{ inputs.runner == 'ubicloud' }}
          WAIT_MINUTES: 10
        run: |
          runner=$PICKED
          if [ "$UBICLOUD" = true ]; then PICKED='"ubicloud-standard-4"'; runner=$PICKED; fi
          if [ "$PC" = true ]; then
            started=false
            end=$(( $(date +%s) + WAIT_MINUTES * 60 ))
            while :; do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[] | select(.name == "Probe the PC runner")][0].status' 2>/dev/null || true)
              case "$status" in in_progress | completed) started=true; break ;; esac
              [ "$(date +%s)" -ge "$end" ] && break
              sleep 10
            done
            if [ "$started" != true ]; then runner=$FALLBACK; fi
          fi
          if [ "$runner" != "$PICKED" ]; then fired="the PC runner did not start within $WAIT_MINUTES minutes, so the Linux tests fell back to $runner"; else fired="no fallback fired"; fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Linux tests run on: $runner (picked $PICKED); $fired" >> "$GITHUB_STEP_SUMMARY"

  script-tests:
    name: Script tests (Linux, ${{ matrix.shard }}/3)
    # Runs where pick-final says, in a throwaway container either way.
    needs: pick-final
    runs-on: ${{ fromJSON(needs.pick-final.outputs.runner) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: ubuntu:24.04
      # An init process reaps killed children, so the process-stop tests see them gone.
      options: --init
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git jq python3 perl procps tmux coreutils ca-certificates sudo >/dev/null
          useradd -m tester
      - uses: actions/checkout@v4
      - name: Show bash
        run: bash --version | head -n 1
      - name: Run the script test harness (as a non-root user)
        run: |
          chown -R tester "$GITHUB_WORKSPACE"
          # The tester user can't write the runner's step summary file, so run.sh
          # writes one it can and the next step appends it.
          sudo -u tester -H env GITHUB_STEP_SUMMARY=/tmp/run-sh-summary.md bash -c 'git config --global user.name CI && git config --global user.email ci@example.invalid && git config --global init.defaultBranch main && git config --global --add safe.directory "*" && plugins/artisan-agent/tests/run.sh -j "$(getconf _NPROCESSORS_ONLN)" --rerun-failed --shard ${{ matrix.shard }}/3'
      - name: List flaky and quarantined tests in the step summary
        if: always()
        run: |
          if [ -f /tmp/run-sh-summary.md ]; then cat /tmp/run-sh-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

  script-tests-macos:
    name: Script tests (macOS, Apple bash 3.2, ${{ matrix.shard }}/3)
    # Apple's own /bin/bash 3.2: the only build that reproduces the EXIT-trap masking
    # #126 guards against (a bash 3.2 built from source on Linux doesn't).
    # On a pull request inputs.macos is null, which GitHub compares equal to false,
    # so the input is read only on a dispatch.
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Show bash
        run: /bin/bash --version | head -n 1
      - name: Run the script test harness under /bin/bash
        run: |
          command -v jq >/dev/null || brew install jq
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          /bin/bash plugins/artisan-agent/tests/run.sh -j "$(getconf _NPROCESSORS_ONLN)" --rerun-failed --shard ${{ matrix.shard }}/3

  quarantine:
    name: Quarantined tests' issues are open
    # Once per run, not per shard: every entry in tests/quarantine.txt must name an
    # open issue. ubuntu-latest has gh; the token only reads this repo's issues.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the quarantine
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash plugins/artisan-agent/tests/run.sh --check-quarantine
