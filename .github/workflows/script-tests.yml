name: Script tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  script-tests:
    name: Script tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Show bash
        run: bash --version | head -n 1
      - name: Run the script test harness
        run: plugins/artisan-agent/tests/run.sh
      - name: Run it again under macOS's bash 3.2
        if: runner.os == 'macOS'
        run: PATH=/bin:/usr/bin:/usr/sbin:/sbin /bin/bash plugins/artisan-agent/tests/run.sh
