name: Script tests

# CI runs on pull requests and on demand only, never on a plain push. A session on
# the Mac gates locally until it opens a PR; a session on the VM dispatches this
# workflow against a throwaway branch to gate a merge.
#
# Linux is one job. macOS is three: a matrix over shard 1, 2 and 3 of 3, each running
# tests/run.sh --shard <i>/3 on its own macos-latest runner, so together they run every
# test exactly once and the macOS job no longer sets the wait. fail-fast is off so every
# failing shard reports. A run's overall conclusion is red if any shard is red, and that
# is all scripts/merge-gate.sh reads.
#
# Every test job passes --rerun-failed: a failed test runs once more on its own, and
# one that then passes is reported FLAKY and doesn't turn the run red. Tests listed in
# tests/quarantine.txt run but can't fail it; the quarantine job checks, once per run,
# that each entry's issue is still open. Flaky and quarantined tests go to the run's
# step summary.
#
# A dispatch's macos input (default true) set to false leaves the macOS job out, so
# the run is Linux only and its overall conclusion is the Linux job's. It is for a
# worker's branch run (ci_gate.worker_inputs in .artisan-agent/config.yml): a GitHub
# Free account runs at most 5 macOS jobs at once across all its repos, and each run
# takes 3. A pull request has no inputs and a dispatch that doesn't pass it gets the
# default, so both run macOS; the merge gate never passes it, so every merge is still
# gated on Linux and Apple bash 3.2.
on:
  pull_request:
    # Documentation outside the plugin isn't read by any test.
    paths-ignore: ['*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      runner:
        description: Linux runner (macOS always runs on macos-latest)
        type: choice
        options: [github, ubicloud]
        default: github
      macos:
        description: Run the macOS job (false leaves it out; a worker's branch run)
        type: boolean
        default: true

# A newer run for the same PR or branch cancels its older run.
concurrency:
  group: script-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  script-tests:
    name: Script tests (Linux)
    # GitHub-hosted by default (free for this public repo: 4 vCPU, 16 GB). Ubicloud
    # only when someone with write access dispatches it; a pull request (fork or not)
    # always gets ubuntu-latest. The job runs in a throwaway container. Never point a
    # public repo's jobs at a self-hosted runner: a fork's PR could run code on it.
    runs-on: ${{ inputs.runner == 'ubicloud' && 'ubicloud-standard-4' || 'ubuntu-latest' }}
    timeout-minutes: 45
    container:
      image: ubuntu:24.04
      # An init process reaps killed children, so the process-stop tests see them gone.
      options: --init
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git jq python3 perl procps tmux coreutils ca-certificates sudo >/dev/null
          useradd -m tester
      - uses: actions/checkout@v4
      - name: Show bash
        run: bash --version | head -n 1
      - name: Run the script test harness (as a non-root user)
        run: |
          chown -R tester "$GITHUB_WORKSPACE"
          # The tester user can't write the runner's step summary file, so run.sh
          # writes one it can and the next step appends it.
          sudo -u tester -H env GITHUB_STEP_SUMMARY=/tmp/run-sh-summary.md bash -c 'git config --global user.name CI && git config --global user.email ci@example.invalid && git config --global init.defaultBranch main && git config --global --add safe.directory "*" && plugins/artisan-agent/tests/run.sh -j "$(getconf _NPROCESSORS_ONLN)" --rerun-failed'
      - name: List flaky and quarantined tests in the step summary
        if: always()
        run: |
          if [ -f /tmp/run-sh-summary.md ]; then cat /tmp/run-sh-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

  script-tests-macos:
    name: Script tests (macOS, Apple bash 3.2, ${{ matrix.shard }}/3)
    # Apple's own /bin/bash 3.2: the only build that reproduces the EXIT-trap masking
    # #126 guards against (a bash 3.2 built from source on Linux doesn't).
    # On a pull request inputs.macos is null, which GitHub compares equal to false,
    # so the input is read only on a dispatch.
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Show bash
        run: /bin/bash --version | head -n 1
      - name: Run the script test harness under /bin/bash
        run: |
          command -v jq >/dev/null || brew install jq
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          /bin/bash plugins/artisan-agent/tests/run.sh -j "$(getconf _NPROCESSORS_ONLN)" --rerun-failed --shard ${{ matrix.shard }}/3

  quarantine:
    name: Quarantined tests' issues are open
    # Once per run, not per shard: every entry in tests/quarantine.txt must name an
    # open issue. ubuntu-latest has gh; the token only reads this repo's issues.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: Check the quarantine
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash plugins/artisan-agent/tests/run.sh --check-quarantine
